[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onejev-harness"
version = "0.1.0"
description = "Training harness around the OneJev decision-model framework"
requires-python = ">=3.11"
dependencies = [
  "pyyaml",
  "numpy",
  "scipy",
  "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = ["pytest"]
gpu = [
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers==5.19.0",
  "peft==0.21.2",
  "accelerate",
  "pillow",
  "jinja2",
  "pydantic",
  "fastapi",
  "uvicorn",
  "safetensors",
  "flash-linear-attention==0.5.2",
]

[project.scripts]
ojh = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
