# 机器配置模板：每人每台机器一份。把 <...> 换成本机的真实路径后，用 --machine <本文件> 传给 ojh。
# 代码里不写任何机器取值，所有机器相关的内容都在这里。
# 路径可以用 ~ 和 $VAR；相对路径相对本文件所在的目录。

# ---- 必填 ----
python: <PYTHON>          # 训练用的 python：写 <repo>/.venv/bin/python（setup.sh 用 uv 建好的环境，见 README 环境配置）
model_dir: <MODEL_DIR>    # 基座权重目录；基座放在 <model_dir>/<基座名>（ojh fetch-base 会下载到这里）
out_root: <OUT_ROOT>      # 输出根目录：<out_root>/<实验名>/prepared 和每个 run 的目录都在这下面

# ---- 登记表 ----
# 默认是 <out_root>/registry.jsonl。多人共用一份时，指到大家都能写的目录。
# registry: <SHARED_DIR>/registry.jsonl

# ---- GPU 规则 ----
# gpu_source: scan 表示扫描 nvidia-smi 后按下面的规则筛卡、加锁：等到有足够的卡空闲显存 ≥ min_free_mib 且
#             卡上没有别人的计算进程（ojh run --allow-shared 才允许共用），最长等 wait_timeout_s；
#             preassigned 表示启动前已设好 CUDA_VISIBLE_DEVICES（例如调度系统分配的卡），
#             直接用这些卡，跳过扫描和加锁；
#             explicit 表示用 ojh run --gpus i,j 指定的卡：逐张检查存在、空闲显存够（取 resolve 的每卡估算和
#             min_free_mib 中较大的）、列出卡上的其他进程；配了 lock_dir 时同样加锁。没有机器配置时默认就是 explicit。
#             --gpus 给了卡号时，无论这里写什么都按 explicit 处理。
gpu_source: scan
# gpu_include: [0, 1, 2, 3]   # 只允许使用这些卡；不写表示所有卡
gpu_exclude: []               # 不允许使用的卡
min_free_mib: 0               # 一张卡至少要有多少空闲显存（MiB）才算可用；共享机器上请设成放得下模型的值
# lock_dir: <LOCK_DIR>        # 锁目录；不配就不加锁。多人共用一台机器时必须是所有人都能写的共享路径
order: free_desc              # 取卡顺序：free_desc（空闲显存从多到少）
wait_timeout_s: 3600          # 等不到足够的卡时最多等多久（秒），超时报 GpuWaitTimeout

# ---- 安全与环境 ----
forbidden_write_roots: []     # 禁止写入的目录：prepare、resolve、fetch-base 和取卡加锁前检查，要写的路径在其下就报错
# 训练进程的环境变量
env:
  HF_HUB_OFFLINE: "1"
