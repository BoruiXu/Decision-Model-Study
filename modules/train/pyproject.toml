[project]
name = "trsi"
version = "1.4.3"
description = "trsi: the training-tuning module's command line: search the training configuration of a OneJev decision model through onejev-harness (ojh) and pack each trial as a framework candidate."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trsi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
