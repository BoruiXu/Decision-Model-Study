[project]
name = "compare"
version = "1.0.0"
description = "compare: the RSI compare module (③ Compare), a code module that trains the task's baselines once per trainset and reports the candidate against them. It runs with <repo>/modules/common, <repo>/modules/train and <repo> on the path (modules/compare/run sets them)."
# The ojh venv's Python: scikit-learn 1.9.1 and xgboost 3.2.0, pinned below, need 3.11 or later.
requires-python = ">=3.11"
# The same bounds as ../common/requirements.txt, which install_deps.sh installs and checks: keep the two equal.
dependencies = ["numpy>=1.24.1,<3", "scikit-learn==1.9.1", "xgboost==3.2.0", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]
lightgbm = ["lightgbm>=4"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["compare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests", "../common", "../train", "../.."]
